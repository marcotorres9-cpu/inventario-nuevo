<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cargando...</title>
<script>
// Clear ALL browser caches
if (window.caches) {
    caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) caches.delete(names[i]);
    });
}
// Clear any old versioned files from sessionStorage/localStorage
try { sessionStorage.clear(); } catch(e) {}
// ALWAYS redirect to latest version with cache-bust
window.location.replace('main-NV62.html?v=' + Date.now());
</script>
</head><body><p style="text-align:center;margin-top:40vh;font-family:sans-serif;color:#666;">Actualizando app...</p></body></html>
